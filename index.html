<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sereness Match</title><style>*{box-sizing:border-box}body{margin:0;background:#eee6dc;color:#594333;font:15px system-ui,sans-serif}#app{max-width:480px;margin:auto;background:#fffcf7;min-height:100dvh;padding-bottom:90px}header{padding:22px 20px;border-bottom:1px solid #e7dacb;display:flex;justify-content:space-between;align-items:center}header b{font:26px Georgia;color:#79543c}small{color:#927d69}main{padding:18px}h2{font-size:19px;margin:22px 0 12px}h3{margin:8px 0}.hero{background:#e8d5be;padding:24px;border-radius:20px}.hero b{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.box{background:white;border:1px solid #e9dfd2;border-radius:16px;padding:12px;margin-bottom:12px}.portrait{height:145px;border-radius:12px;background:linear-gradient(145deg,#e9d7c4,#b99c81);display:grid;place-items:center;font-size:58px;color:white}.card p{font-size:12px;margin:6px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#89664d;color:white;padding:11px;cursor:pointer}button.light{background:#f0e5d8;color:#79543c}button.wide{width:100%;margin-top:8px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;background:#fffaf3;border-top:1px solid #e4d7c6;padding:8px 2px max(10px,env(safe-area-inset-bottom));z-index:2}nav button{flex:1;background:none;color:#927d69;font-size:10px;padding:5px 0}nav button span{display:block;font-size:23px}nav button.active{color:#79543c;font-weight:bold;background:#efe2d3}input,select,textarea{width:100%;padding:12px;border:1px solid #d9c8b6;border-radius:10px;background:white;margin:6px 0 12px;color:#594333}label{display:block;font-size:13px}.tag{display:inline-block;background:#f3e9dd;border-radius:20px;padding:4px 8px;font-size:11px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.note{font-size:12px;color:#927d69}.bubble{background:#eee1d1;border-radius:14px;padding:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}</style><div id="app"><header><div><b>Sereness Match</b><br><small>秋田で、心が通う出会いを。</small></div><button class="light" onclick="alert('試作版のお知らせ：架空の会員で操作をお試しください。')">♧</button></header><main id="main"><div class="hero"><small>WELCOME TO SERENESS</small><p><b>今日、新しい出会いを。</b></p>自分のペースで、恋活・婚活。</div><p class="note">試作版・架空の会員</p><h2>今日のおすすめ</h2><div class="grid"><article class="card"><div class="portrait">🌷</div><h3>あかり 34歳</h3><small>秋田市</small><p>カフェ巡り・映画</p></article><article class="card"><div class="portrait">🌿</div><h3>みさき 39歳</h3><small>横手市</small><p>旅行・料理</p></article></div><div class="box">この表示が残る場合は、プレビューでJavaScriptが実行されていません。パソコンのブラウザでHTMLを開いてください。</div></main><nav id="nav"><button><span>⌂</span>ホーム</button><button><span>⌕</span>さがす</button><button><span>♡</span>いいね</button><button><span>✉</span>メッセージ</button><button><span>☕</span>セレネス</button><button><span>♙</span>マイページ</button></nav></div><script>
const people=[{id:1,n:'あかり',a:34,c:'秋田市',h:'カフェ巡り・映画',m:'再婚理解あり',s:'女性',e:'🌷'},{id:2,n:'みさき',a:39,c:'横手市',h:'旅行・料理',m:'再婚希望',s:'女性',e:'🌿'},{id:3,n:'ゆうた',a:36,c:'秋田市',h:'音楽・ドライブ',m:'初婚',s:'男性',e:'☕'},{id:4,n:'けんじ',a:45,c:'由利本荘市',h:'読書・散歩',m:'再婚希望',s:'男性',e:'🍂'},{id:5,n:'さくら',a:42,c:'大仙市',h:'パン・温泉',m:'再婚希望',s:'女性',e:'🌸'},{id:6,n:'なおき',a:32,c:'秋田市',h:'ゲーム・カフェ',m:'初婚',s:'男性',e:'🌱'}];let state={likes:[],blocked:[],msgs:{},profile:{},requests:[]};try{Object.assign(state,JSON.parse(localStorage.getItem('serenessDemo')||'{}'))}catch(e){}const save=()=>{try{localStorage.setItem('serenessDemo',JSON.stringify(state))}catch(e){}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab=0;const names=['ホーム','さがす','いいね','メッセージ','セレネス','マイページ'],icons=['⌂','⌕','♡','✉','☕','♙'];const main=document.getElementById('main');function renderNav(){document.getElementById('nav').innerHTML=names.map((n,i)=>`<button class="${i===tab?'active':''}" onclick="go(${i})"><span>${icons[i]}</span>${n}</button>`).join('')}function list(){return people.filter(p=>!state.blocked.includes(p.id))}function cards(ps){return '<div class="grid">'+ps.map(p=>`<article class="card"><div class="portrait" onclick="detail(${p.id})">${p.e}</div><h3 onclick="detail(${p.id})">${p.n} ${p.a}歳</h3><small>${p.c} ・ 確認済（架空）</small><p>${p.h}</p><span class="tag">${p.m}</span><button class="wide ${state.likes.includes(p.id)?'light':''}" onclick="like(${p.id})">${state.likes.includes(p.id)?'♥ 送信済み':'♡ いいね'}</button></article>`).join('')+'</div>'}function go(i){tab=i;renderNav();window.scrollTo(0,0);if(i===0)main.innerHTML=`<div class="hero"><small>WELCOME TO SERENESS</small><p><b>今日、新しい出会いを。</b></p>自分のペースで、恋活・婚活。</div><p class="note">DEMO • 会員・確認マークはすべて架空です</p><h2>今日のおすすめ</h2>${cards(list().slice(0,4))}<h2>セレネスからのお知らせ</h2><div class="box">カフェでの顔合わせや婚活相談も。<button class="wide light" onclick="go(4)">サービスを見る</button></div>`;if(i===1)main.innerHTML=`<h2>お相手をさがす</h2><label>性別<select id="sex"><option>指定なし</option><option>女性</option><option>男性</option></select></label><div class="row"><label>最低年齢<input id="min" type="number" value="18" min="18"></label><label>最高年齢<input id="max" type="number" value="99"></label></div><label>地域・趣味<input id="q" placeholder="秋田市、カフェなど"></label><label>婚歴・希望<select id="mar"><option>指定なし</option><option>再婚希望</option><option>再婚理解あり</option><option>初婚</option></select></label><button class="wide" onclick="search()">検索する</button><h2>検索結果</h2><div id="results">${cards(list())}</div>`;if(i===2)main.innerHTML='<h2>送ったいいね</h2>'+ (state.likes.length?cards(list().filter(p=>state.likes.includes(p.id))):'<div class="box">まだいいねがありません。</div>');if(i===3)main.innerHTML='<h2>メッセージ</h2><p class="note">試作ではいいねを送ると模擬マッチングが成立します。</p>'+list().filter(p=>state.likes.includes(p.id)).map(p=>`<div class="box" onclick="chat(${p.id})">${p.e}　${p.n}　<small>模擬マッチング成立 ›</small></div>`).join('');if(i===4)main.innerHTML='<div class="hero"><b>Sereness Café & Support</b><p>出会いのその先も、サポート。</p></div>'+['婚活・恋愛相談','カウンセラーからのお相手紹介','プロフィール診断','カフェでの顔合わせ予約','婚活イベント','再婚活サポート'].map(n=>`<div class="box"><h3>${n}</h3><button class="wide light" onclick="request('${n}')">詳細・申込み</button></div>`).join('');if(i===5)main.innerHTML=`<h2>マイページ</h2><div class="box"><label>ニックネーム<input id="pn" value="${esc(state.profile.n)}"></label><label>年齢<input id="pa" type="number" min="18" value="${esc(state.profile.a)}"></label><label>居住地<input id="pc" value="${esc(state.profile.c)}"></label><label>自己紹介<textarea id="pb">${esc(state.profile.b)}</textarea></label><button class="wide" onclick="profile()">プロフィール保存</button></div><div class="box">無料会員（試作）<p>本人確認：未実装</p><button class="light" onclick="admin()">管理者画面デモ</button></div><h2>申込み履歴</h2>${state.requests.map(r=>`<div class="box">${esc(r)}</div>`).join('')}`}
function search(){let q=document.getElementById('q').value.trim(),s=document.getElementById('sex').value,m=document.getElementById('mar').value,a=+document.getElementById('min').value,b=+document.getElementById('max').value;let ps=list().filter(p=>(s==='指定なし'||p.s===s)&&(m==='指定なし'||p.m===m)&&p.a>=a&&p.a<=b&&(p.c+p.h).includes(q));document.getElementById('results').innerHTML=ps.length?cards(ps):'該当する会員はいません。'}function like(id){if(state.likes.includes(id)){state.likes=state.likes.filter(x=>x!==id)}else{state.likes.push(id);alert('いいねを送信しました！ 模擬マッチング成立♡')}save();go(tab)}function detail(id){let p=people.find(x=>x.id===id);main.innerHTML=`<button class="light" onclick="go(tab)">‹ 戻る</button><div class="portrait" style="height:220px;margin-top:12px">${p.e}</div><h2>${p.n} ${p.a}歳</h2><p>${p.c} / ${p.m}</p><div class="box">趣味：${p.h}<p>ゆっくりお話しできる方と出会いたいです。（架空）</p></div><button class="wide" onclick="like(${id})">♡ いいね切替</button><button class="wide light" onclick="if(confirm('非表示にしますか？')){state.blocked.push(${id});save();go(tab)}">ブロック</button><button class="wide light" onclick="state.requests.push('通報デモ：${p.n}');save();alert('端末内に通報デモを記録しました')">通報（デモ）</button>`}function chat(id){let p=people.find(x=>x.id===id);main.innerHTML=`<button class="light" onclick="go(3)">‹ 戻る</button><h2>${p.e} ${p.n}</h2><div class="bubble">はじめまして！（架空の定型文）</div>${(state.msgs[id]||[]).map(x=>`<div class="bubble">${esc(x)}</div>`).join('')}<input id="message" placeholder="メッセージを入力"><button class="wide" onclick="send(${id})">送信（端末内のみ）</button>`}function send(id){let v=document.getElementById('message').value.trim();if(v){(state.msgs[id]??=[]).push(v);save();chat(id)}}function request(n){if(confirm(n+' の申込みを試しますか？ 実際の予約は行われません。')){state.requests.push(n);save();alert('端末内に申込みを記録しました')}}function profile(){let a=+document.getElementById('pa').value;if(a<18){alert('18歳以上の年齢を入力してください');return}state.profile={n:document.getElementById('pn').value,a,c:document.getElementById('pc').value,b:document.getElementById('pb').value};save();alert('端末内に保存しました')}function admin(){main.innerHTML=`<button class="light" onclick="go(5)">‹ 戻る</button><h2>管理者画面（デモ）</h2><div class="box">架空会員：${people.length}名<br>模擬申込み：${state.requests.length}件</div>${people.map(p=>`<div class="box">${p.n} ${p.a}歳 / ${p.c}</div>`).join('')}<p class="note">管理者認証・実際の審査機能は未実装です。</p>`}go(0);
</script></html>
